<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mob3 — Hierarchy Lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1218;
        color: #d5dde8;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 0;
        right: 0;
        width: min(340px, 100%);
        height: 100%;
        overflow: auto;
        background: rgba(10, 14, 20, 0.92);
        border-left: 1px solid #243044;
        padding: 1rem;
        box-sizing: border-box;
        font-size: 0.8rem;
        line-height: 1.35;
      }
      #panel h1 {
        font-size: 1rem;
        margin: 0 0 0.5rem;
        font-weight: 600;
        color: #eef3fa;
      }
      #panel button {
        display: block;
        width: 100%;
        margin: 0.25rem 0;
        padding: 0.4rem 0.5rem;
        background: #1a2433;
        color: #d5dde8;
        border: 1px solid #33455c;
        cursor: pointer;
        text-align: left;
      }
      #panel button:hover {
        background: #243044;
      }
      #panel pre {
        white-space: pre-wrap;
        background: #121821;
        padding: 0.5rem;
        border: 1px solid #243044;
        max-height: 40vh;
        overflow: auto;
      }
      .row {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        margin: 0.35rem 0;
      }
      label {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <aside id="panel">
      <h1>Hierarchy Lab</h1>
      <p>ECS-authoritative parent/child. Flat Three sync from GlobalTransform.</p>
      <div class="row">
        <label><input type="checkbox" id="paused" /> paused</label>
      </div>
      <div class="row">
        <label
          >preserve
          <select id="preserve">
            <option value="local">local</option>
            <option value="global">global</option>
          </select>
        </label>
      </div>
      <button type="button" data-act="reparent-moona">Satellite → MoonA</button>
      <button type="button" data-act="reparent-planeta">Satellite → PlanetA</button>
      <button type="button" data-act="reparent-root">Satellite → root</button>
      <button type="button" data-act="despawn-cascade">Despawn PlanetA (cascade)</button>
      <button type="button" data-act="despawn-detach">Despawn PlanetB (detach)</button>
      <button type="button" data-act="mutate-branch">Nudge Sun branch</button>
      <button type="button" data-act="spawn-moon">Spawn moon on PlanetB</button>
      <button type="button" data-act="inspect">Inspect Satellite</button>
      <p>Changed GlobalTransforms / frame: <strong id="changed">0</strong></p>
      <pre id="tree">loading…</pre>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
